# Independent service with repository root as build context; do not apply to existing services.
[build]
builder = "DOCKERFILE"
dockerfilePath = "services/household/Dockerfile"

[deploy]
startCommand = "python -m services.household.app"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3