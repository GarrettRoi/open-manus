<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ label }} — Desktop Viewer</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#111;color:#eee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
  #toolbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#1a1a2e;border-bottom:1px solid #333;flex-shrink:0;flex-wrap:wrap}
  #toolbar h1{font-size:15px;font-weight:600;color:#a78bfa;margin-right:auto}
  .btn{padding:5px 12px;border-radius:6px;border:1px solid #555;background:#222;color:#ddd;font-size:13px;cursor:pointer;transition:background .15s}
  .btn:hover{background:#333}
  .btn.danger{border-color:#7f1d1d;color:#fca5a5}
  .btn.danger:hover{background:#7f1d1d}
  .btn.success{border-color:#065f46;background:#064e3b;color:#6ee7b7}
  .btn.success:hover{background:#065f46}
  #status{font-size:12px;padding:3px 10px;border-radius:10px;background:#374151;color:#9ca3af}
  #status.connected{background:#064e3b;color:#6ee7b7}
  #status.error{background:#7f1d1d;color:#fca5a5}
  #screen-wrap{flex:1;overflow:hidden;position:relative;background:#000}
  #screen{width:100%;height:100%}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.85)}
  #overlay p{font-size:14px;color:#9ca3af;text-align:center;max-width:380px}
  #overlay.hidden{display:none}
  /* Handoff notification banner */
  #handoff-banner{display:none;align-items:center;gap:12px;padding:10px 16px;background:#78350f;border-bottom:2px solid #d97706;color:#fef3c7;font-size:13px;flex-shrink:0}
  #handoff-banner.show{display:flex}
  #handoff-msg{flex:1;font-weight:500}
  #handoff-time{font-size:11px;color:#fcd34d;opacity:.8;white-space:nowrap}
  #fallback{padding:10px 20px;border-top:1px solid #333;font-size:12px;color:#6b7280;flex-shrink:0}
  #fallback a{color:#a78bfa}
  kbd{background:#2d2d2d;border:1px solid #555;border-radius:3px;padding:1px 5px;font-size:12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  #handoff-dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;animation:pulse 1.5s infinite;flex-shrink:0}
</style>
</head>
<body>

<!-- Agent handoff request notification -->
<div id="handoff-banner">
  <div id="handoff-dot"></div>
  <span id="handoff-msg">An agent is requesting your help with the desktop.</span>
  <span id="handoff-time"></span>
  <button class="btn success" onclick="releaseHandoff()">✓ Done — hand control back</button>
  <button class="btn danger" onclick="dismissHandoff()">✕ Dismiss</button>
</div>

<div id="toolbar">
  <h1>🖥️ {{ label }}</h1>
  <span id="status">Connecting…</span>
  <button class="btn" onclick="sendCtrlAltDel()">Ctrl+Alt+Del</button>
  <button class="btn" onclick="toggleClip()">Clipboard</button>
  <button class="btn" onclick="toggleScale()">Scale</button>
  <button class="btn danger" onclick="disconnect()">Disconnect</button>
</div>

<div id="screen-wrap">
  <div id="screen"></div>
  <div id="overlay">
    <div style="font-size:48px">🖥️</div>
    <p id="overlay-msg">Connecting to <strong>{{ label }}</strong> via SSH tunnel…</p>
    <div id="spinner" style="width:28px;height:28px;border:3px solid #374151;border-top-color:#a78bfa;border-radius:50%;animation:spin 0.8s linear infinite"></div>
  </div>
</div>

<div id="fallback">
  Can't connect? Try:
  <a href="https://apps.apple.com/app/jump-desktop/id364876095" target="_blank">Jump Desktop</a> ·
  <a href="https://www.realvnc.com/en/connect/download/viewer/" target="_blank">RealVNC</a> ·
  <a href="https://tigervnc.org/" target="_blank">TigerVNC</a>
  → <kbd>{{ vnc_host }}</kbd>:<kbd>{{ vnc_port }}</kbd>
  &nbsp;·&nbsp;<a href="/services" target="_blank">Dashboard</a>
</div>

<script type="module">
const WS_URL          = {{ ws_url | tojson }};
const HANDOFF_POLL    = {{ handoff_poll_url | tojson }};
const HANDOFF_RELEASE = {{ handoff_release_url | tojson }};

let rfb = null;
const screenEl   = document.getElementById("screen");
const overlay    = document.getElementById("overlay");
const statusEl   = document.getElementById("status");
const overlayMsg = document.getElementById("overlay-msg");
const banner     = document.getElementById("handoff-banner");
const bannerMsg  = document.getElementById("handoff-msg");
const bannerTime = document.getElementById("handoff-time");

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

function showOverlay(msg) { overlayMsg.textContent = msg; overlay.classList.remove("hidden"); }
function hideOverlay()    { overlay.classList.add("hidden"); }
function toggleScale()    { if (rfb) rfb.scaleViewport = !rfb.scaleViewport; }

async function connect() {
  try {
    const { default: RFB } = await import(
      "https://cdn.jsdelivr.net/npm/@novnc/novnc@1.4.0/core/rfb.js"
    );
    rfb = new RFB(screenEl, WS_URL, { wsProtocols: ["binary", "base64"] });
    rfb.scaleViewport = true;
    rfb.resizeSession = false;

    rfb.addEventListener("connect", () => { setStatus("Connected", "connected"); hideOverlay(); });
    rfb.addEventListener("disconnect", e => {
      const clean = e.detail?.clean;
      setStatus(clean ? "Disconnected" : "Connection lost", "error");
      showOverlay(clean
        ? "Session ended. Refresh to reconnect."
        : "Connection lost — the SSH tunnel may have dropped. Refresh to retry.");
    });
    rfb.addEventListener("credentialsrequired", () => {
      const pw = prompt("VNC password:");
      if (pw !== null) rfb.sendCredentials({ password: pw });
    });
    rfb.addEventListener("securityfailure", () => {
      setStatus("Auth failed", "error");
      showOverlay("VNC authentication failed. Check the VNC password in the vault connection settings.");
    });
  } catch (err) {
    setStatus("Load error", "error");
    showOverlay("Could not load noVNC: " + err.message +
      " — try a native VNC client (see links below).");
  }
}

function sendCtrlAltDel() { rfb?.sendCtrlAltDel(); }

function disconnect() {
  rfb?.disconnect(); rfb = null;
  setStatus("Disconnected");
  showOverlay("Disconnected. Refresh to reconnect.");
}

let clipOpen = false;
function toggleClip() {
  if (!rfb) return;
  const text = prompt("Paste text to send to the Mac clipboard:");
  if (text !== null) rfb.clipboardPasteFrom(text);
}

// ── Handoff notification polling ─────────────────────────────────────────────
let lastHandoffStatus = "idle";

async function pollHandoff() {
  try {
    const res = await fetch(HANDOFF_POLL, { credentials: "include" });
    if (!res.ok) return;
    const data = await res.json();
    if (data.status === "requested" && lastHandoffStatus !== "requested") {
      // New request — show banner
      const msg = data.message || "An agent is requesting your help.";
      const by  = data.requested_by ? ` (from ${data.requested_by})` : "";
      const at  = data.requested_at ? new Date(data.requested_at).toLocaleTimeString() : "";
      bannerMsg.textContent = `🤖 ${msg}${by}`;
      bannerTime.textContent = at ? `at ${at}` : "";
      banner.classList.add("show");
    } else if (data.status !== "requested") {
      banner.classList.remove("show");
    }
    lastHandoffStatus = data.status || "idle";
  } catch (_) {}
}

async function releaseHandoff() {
  try {
    await fetch(HANDOFF_RELEASE, { method: "POST", credentials: "include" });
  } catch (_) {}
  banner.classList.remove("show");
  lastHandoffStatus = "idle";
}

function dismissHandoff() {
  banner.classList.remove("show");
  lastHandoffStatus = "idle";  // suppress until next request
}

connect();
pollHandoff();
setInterval(pollHandoff, 10000);  // poll every 10 s
</script>
</body>
</html>
